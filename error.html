<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

@import url('https://fonts.googleapis.com/css?family=Abril+Fatface|Lato');


body {
  background: #05635d;
}

.top {
  margin-top: 30px;
}

.container {
  margin: 0 auto;
  position: relative;
  width: 250px;
  height: 250px;
  margin-top: -40px;
}

.ghost {
  width: 50%;
  height: 53%;
  left: 25%;
  top: 10%;
  position: absolute;
  border-radius: 50% 50% 0 0;
  background: white;
  border: 1px solid #D4B46D;
  border-bottom: none;
  animation: float 2s ease-out infinite;
}

.ghost-copy {
  width: 50%;
  height: 53%;
  left: 25%;
  top: 10%;
  position: absolute;
  border-radius: 50% 50% 0 0;
  background: white;
  border: 1px solid #D4B46D;
  border-bottom: none;
  animation: float 2s ease-out infinite;
  z-index: 0;
}


.face {
  position: absolute;
  width: 100%;
  height: 60%;
  top: 20%;
}
.eye, .eye-right {
  position: absolute;
  background: #D4B46D;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  top: 40%;
}

.eye {
  left: 25%;
}
.eye-right {
  right: 25%;
}

.mouth {
  position:absolute;
  top: 50%;
  left: 45%;
  width: 10px;
  height: 10px;
  border: 3px solid;
  border-radius: 50%;
  border-color: transparent #D4B46D #D4B46D transparent;
  transform: rotate(45deg);
}

.one, .two, .three, .four {
  position: absolute;
  background: white;
  top: 85%;
  width: 25%;
  height: 23%;
  border: 1px solid #D4B46D;
  z-index: 0;
}

.one {
  border-radius: 0 0 100% 30%;
  left: -1px;
}

.two {
  left: 23%;
  border-radius: 0 0 50% 50%;
}

.three {
  left: 50%;
  border-radius: 0 0 50% 50%;
}

.four {
  left: 74.5%;
  border-radius: 0 0 30% 100%;
}

.shadow {
  position: absolute;
  width: 30%;
  height: 7%;
  background: #D4B46D;
  left: 35%;
  top: 80%;
  border-radius: 50%;
  animation: scale 2s infinite;
}

@keyframes scale {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes float {
  50% {
     transform: translateY(15px);
  }
}

.bottom {
  margin-top: 10px;
}

/*text styling*/
h1 {
  font-family: big;
  color: white;
  text-align: center;
  font-size: 9em;
  margin: 0;
  text-shadow: -1px 0 #D4B46D, 0 1px #D4B46D, 1px 0 #D4B46D, 0 -1px #D4B46D;
}
h3 {
  font-family: body;
  font-size: 2em;
  text-transform: uppercase;
  text-align: center;
  color: #D4B46D;
  margin-top: -20px;
  font-weight: 900;
}
p {
  text-align: center;
  font-family: body;
  color: #D4B46D;
  font-size: 15px;
  margin-top: -20px;
}

.buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 10px;
}

.btn {
  background: white;
  padding: 15px 20px;
  margin: 5px;
  color: #D4B46D;
  font-family: body;
  text-transform: uppercase;
  font-size: 15px;
  letter-spacing: 1px;
  border: 0;
}
.buttons .btn a{
  text-decoration: none;
  color: #D4B46D;
  font-size: 15px;
}
.buttons .btn a:hover{
  background: #D4B46D;
    color: aliceblue;
    transition: all .4s ease-out;
}
    </style>
</head>
<body>
    <div id="background"></div>
<div class="top">
  <h1>404</h1>
  <h3>page not found</h3>
</div>
<div class="container">
  <div class="ghost-copy">
    <div class="one"></div>
    <div class="two"></div>
    <div class="three"></div>
    <div class="four"></div>
  </div>
  <div class="ghost">
    <div class="face">
      <div class="eye"></div>
      <div class="eye-right"></div>
      <div class="mouth"></div>
    </div>
  </div>
  <div class="shadow"></div>
</div>
<div class="bottom">
  <h3>Sorry Page Was Not Found!!</h3>

  <div class="buttons">
    <button class="btn"><a href="https://aaryantradelink.com/beta/Home">Back To Home</a></button>
  </div>
</div>

</body>
</html>
